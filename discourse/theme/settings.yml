ba_moi_username:
  type: string
  default: ""
  description:
    en: "Discourse username for Bà Mối. Leave blank until the bot account exists. The Bà Mối sidebar link and first-step aside are hidden unless this is a safe username."
    vi: "Tên người dùng Discourse của Bà Mối. Để trống cho đến khi tài khoản bot tồn tại. Liên kết Bà Mối chỉ hiện với tên người dùng hợp lệ."

introduction_category_id:
  type: integer
  default: 0
  description:
    en: "Category used by the first-step 'Viết lời giới thiệu' action. Set by the presentation bootstrap."
    vi: "Chuyên mục cho nút 'Viết lời giới thiệu'. Được thiết lập bởi presentation bootstrap."
