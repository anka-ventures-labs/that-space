# Private Thật Space upload boundary. This file is included at Nginx `server`
# scope by Discourse's documented server outlet. `^~` is deliberate: it wins
# before the stock outer font/image regex can serve an original upload directly.
#
# The `session/current` endpoint returns 200 for a signed-in member and 404 for
# a guest. auth_request treats a 404 as an upstream error, so the internal
# subrequest maps that one expected guest result to 403. Any other upstream
# failure remains a failed auth request and therefore fails closed.

location = /that-space-upload-auth {
  internal;
  proxy_pass http://discourse/session/current.json;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $thescheme;
  proxy_intercept_errors on;
  error_page 404 = @that_space_upload_forbidden;
}

location @that_space_upload_forbidden {
  return 403;
}

location ^~ /uploads/ {
  root $public;
  auth_request /that-space-upload-auth;

  # No upload response may be stored by a shared cache. `always` covers the
  # denied path as well as static originals and Rails/X-Accel responses.
  expires off;
  add_header Cache-Control "private, no-store" always;

  # Repeat the upload proxy headers from the stock location. Non-image files
  # continue through Rails so its attachment policy and X-Accel redirects work.
  proxy_set_header Host $http_host;
  proxy_set_header X-Request-Start "t=${msec}";
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $thescheme;
  proxy_set_header X-Sendfile-Type X-Accel-Redirect;
  proxy_set_header X-Accel-Mapping $public/=/downloads/;
  proxy_set_header Client-Ip "";

  # Short URLs must remain a Rails authorization path. It inherits auth_request
  # and the private cache policy from the enclosing uploads location.
  location ~ ^/uploads/short-url/ {
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-Start "t=${msec}";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $thescheme;
    proxy_set_header X-Sendfile-Type "";
    proxy_set_header X-Accel-Mapping "";
    proxy_set_header Client-Ip "";
    proxy_pass http://discourse;
    break;
  }

  # Keep stock static acceleration, but only after the member subrequest.
  location ~ /stylesheet-cache/ {
    try_files $uri =404;
  }

  location ~* \.(gif|png|jpg|jpeg|bmp|tif|tiff|ico|webp|avif)$ {
    try_files $uri =404;
  }

  # Direct SVG navigation must remain a download. Its own add_header directive
  # repeats Cache-Control because Nginx does not inherit add_header directives
  # into a child location that declares another header.
  location ~* \.(svg)$ {
    add_header Cache-Control "private, no-store" always;
    add_header Content-Disposition attachment always;
    try_files $uri =404;
  }

  location ~ /_?optimized/ {
    try_files $uri =404;
  }

  proxy_pass http://discourse;
  break;
}

# Root may place only exact, owned theme branding/font routes here. This outlet
# does not create public exceptions itself, and the directory persists across
# launcher rebuilds on the shared volume.
include /shared/operations/nginx/public-assets/*.conf;
